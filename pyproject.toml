[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-engine"
version = "0.1.0"
description = "Async event-driven multimodal AI engine (vision + voice)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
]

[project.optional-dependencies]
vision = ["opencv-python>=4.9"]
audio = ["faster-whisper>=1.0", "sounddevice>=0.4", "pyttsx3>=2.90"]
ui = ["PySide6>=6.6"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]
# Headless builds for servers and CI (no display libraries needed). Install these instead of the
# "vision" and "ui" extras there:  pip install -e ".[dev,ci]"
ci = ["opencv-python-headless>=4.9", "PySide6-Essentials>=6.6"]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["config*", "core*", "vision*", "audio*", "storage*", "ui*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Real mistakes only (syntax errors, undefined names, unused imports and variables). Pinned so that a
# newer ruff with a bigger default rule set cannot turn CI red by itself.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The Qt imports must come after the "is PySide6 installed?" guard, so they cannot sit at the top.
"tests/test_gui.py" = ["E402"]
