[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-engine"
version = "0.1.0"
description = "Async event-driven multimodal AI engine (vision + voice)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
]

[project.optional-dependencies]
vision = ["opencv-python>=4.9", "mediapipe>=0.10", "deepface>=0.0.93"]
audio = ["faster-whisper>=1.0", "sounddevice>=0.4", "pyttsx3>=2.90"]
ui = ["PySide6>=6.6"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["config*", "core*", "vision*", "audio*", "storage*", "ui*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
